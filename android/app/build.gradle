plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.elysium.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.elysium.player"
        minSdk 24
        targetSdk 34
        versionCode 15
        versionName "1.5.0"
        python {
            version "3.10"
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // 主程序纯标准库；mutagen 负责写音频标签（纯 Python，universal wheel）
        pip {
            install "mutagen"
        }
    }
    sourceSets {
        python {
            srcDir "src/main/python"
        }
    }
}
