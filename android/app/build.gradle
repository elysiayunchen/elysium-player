plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.elysium.player'
    compileSdk 34

    defaultConfig {
        applicationId "com.elysium.player"
        minSdk 24
        targetSdk 34
        versionCode 27
        versionName "2.3.0-beta5"
        python {
            version "3.10"
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // 固定签名：应用内更新靠覆盖安装，新旧 APK 签名必须一致。
    // debug 与 release 都用同一把钥匙；仓库是公开的，keystore + 密码随库走
    // （个人侧载应用的取舍：签名连续性 > 密钥保密性，见 android/README.md）。
    signingConfigs {
        elysium {
            storeFile rootProject.file("elysium.keystore")
            storePassword "elysium2026"
            keyAlias "elysium"
            keyPassword "elysium2026"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.elysium
        }
        release {
            signingConfig signingConfigs.elysium
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'   // FileProvider：把下载好的 APK 共享给系统安装器
    implementation 'androidx.media:media:1.7.0'  // MediaStyle：通知栏媒体控制模板
}

chaquopy {
    defaultConfig {
        // 主程序纯标准库；mutagen 负责写音频标签（纯 Python，universal wheel）
        pip {
            install "mutagen"
        }
    }
    sourceSets {
        python {
            srcDir "src/main/python"
        }
    }
}

// ---------------------------------------------------------------------------
// 运行时源码同步：src/main/python 是「仓库根的构建镜像」，不入库（.gitignore）。
// 教训（v2.2.0-beta1）：镜像此前靠构建机手工拷贝，构建时没拷新 → APK 里打包的
// 是 v1.6.0 的旧前端旧后端，P9/P10 根本没进包。这里固化为构建前自动同步，
// 任何 clone、任何机器构建都拿到当前源码。每次构建清空重拷（几 MB，不值得做增量）。
// ---------------------------------------------------------------------------
def repoRoot = rootProject.projectDir.parentFile

tasks.register('syncPythonSources', Copy) {
    description = '仓库根 main.py/importer.py/sync_engine.py/providers/web → Chaquopy python srcDir'
    outputs.upToDateWhen { false }          // 每次都执行：清空重拷，防删除残留
    doFirst {
        delete layout.projectDirectory.dir('src/main/python')
    }
    into layout.projectDirectory.dir('src/main/python')
    from(repoRoot) { include 'main.py', 'importer.py', 'sync_engine.py' }
    from(repoRoot) { include 'providers/**' }
    from(repoRoot) { include 'web/**' }
}

tasks.named('preBuild') { dependsOn 'syncPythonSources' }
// Chaquopy 的 merge*PythonSources 直接消费 src/main/python：Gradle 的隐式依赖
// 校验要求「消费方显式依赖生产方」，只挂 preBuild 不够（beta2 构建实测报错）。
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('PythonSources') }
     .configureEach { dependsOn 'syncPythonSources' }
