<!doctype html>
<html lang="zh-CN" data-theme="dark" data-chrome="on">
<head>
<meta charset="utf-8"/>
<!-- viewport-fit=cover：仅对 Android edge-to-edge 生效，桌面 WebView2 忽略 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Elysium</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css"/>
<!-- 窗口壳层：必须在 style.css 之后；回滚只需删掉这两行引用 -->
<link rel="stylesheet" href="/window-chrome.css"/>
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18.5a2.5 2.5 0 1 1-2.5-2.5c.4 0 .8.1 1.1.2V5.6c0-.5.3-.9.8-1l7.3-1.6c.7-.2 1.3.3 1.3 1v10.9a2.5 2.5 0 1 1-1.6-2.3V6.2L9 7.5v11z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2c0-.9 1-1.5 1.8-1L19 10.8c.8.5.8 1.7 0 2.2L9.8 19.8c-.8.5-1.8-.1-1.8-1V5.2z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3.2v16H7zM13.8 4H17v16h-3.2z"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16 6.3 10.3l1.4-1.4L11 12.2V3zM4 18h16v2H4z"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3l-1.1-1C6 14.9 3 12.2 3 8.9 3 6.2 5.1 4 7.8 4c1.6 0 3.1.7 4.2 1.9C13.1 4.7 14.6 4 16.2 4 18.9 4 21 6.2 21 8.9c0 3.3-3 6-7.9 10.4l-1.1 1z"/></symbol>
  <symbol id="i-heart-o" viewBox="0 0 24 24"><path d="M12 19l-.7-.6C6.4 14.1 4 11.8 4 8.9 4 6.7 5.6 5 7.8 5c1.3 0 2.6.6 3.5 1.7l.7.9.7-.9C13.6 5.6 14.9 5 16.2 5 18.4 5 20 6.7 20 8.9c0 2.9-2.4 5.2-7.3 9.5l-.7.6zm0-11.6C11.2 6.1 10 5.5 8.9 5.5 7.3 5.5 6 6.7 6 8.3c0 2.2 2 4.3 6 7.8 4-3.5 6-5.6 6-7.8 0-1.6-1.3-2.8-2.9-2.8-1.1 0-2.3.6-3.1 1.9z"/></symbol>
  <symbol id="i-quote" viewBox="0 0 24 24"><path d="M4 17h16v2H4zm0-4h10v2H4zm0-4h16v2H4zm0-4h10v2H4z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 3.5c0 .5 0 1-.1 1.4l2 1.5-2 3.4-2.3-.9c-.7.6-1.5 1.1-2.3 1.4L15.9 22h-4l-.4-2.3c-.9-.3-1.6-.8-2.3-1.4l-2.3.9-2-3.4L7 14.4A11 11 0 0 1 7 12c0-.5 0-1 .1-1.4L5 9.1l2-3.4 2.3.9c.7-.6 1.5-1.1 2.3-1.4L12 2.9h4l.4 2.3c.9.3 1.6.8 2.3 1.4l2.3-.9 2 3.4-2 1.5c.1.4.1.9.1 1.4z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 5h2v14H7zm3.8 7L18 5.2v13.6L10.8 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M15 5h2v14h-2zM13.2 12L6 18.8V5.2L13.2 12z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9h3l4-3.5v13L7 15H4zm10.4-2.2a6 6 0 0 1 0 10.4l-1-1.7a4 4 0 0 0 0-7z"/></symbol>
  <symbol id="i-vol-x" viewBox="0 0 24 24"><path d="M4 9h3l4-3.5v13L7 15H4zm10.6 1.1 1.4-1.4 1.8 1.8 1.8-1.8 1.4 1.4L19.2 12l1.8 1.8-1.4 1.4-1.8-1.8-1.8 1.8-1.4-1.4 1.8-1.8z"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h11v2H4zm0 5h11v2H4zm0 5h7v2H4zm12-8.4L21.5 11 16 14.4V7.6z"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v2.5L21 6l-4-3.5V5H5v6h2V7zm10 10H7v-2.5L3 18l4 3.5V19h12v-6h-2v4z"/></symbol>
  <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 7h10v2.5L21 6l-4-3.5V5H5v6h2V7zm10 10H7v-2.5L3 18l4 3.5V19h12v-6h-2v4zM12.9 9.6h-1.2l-1.4.8v1.2l1.3-.8v4.8h1.3V9.6z"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 4h5v5h-2V7.4l-4.3 4.3-1.4-1.4L17.6 6H16V4zM3 6h4.2l9.5 9.5H21v2h-5l-9.5-9.5H3V6zm0 12h4.2l3.3-3.3 1.4 1.4L7.6 20H3v-2z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-1 12H7L6 9z"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9.6 16.2 5.4 12l-1.4 1.4 5.6 5.6L20 8.6 18.6 7.2z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M6 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm6 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm6 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3.2 21 10v10.3c0 .4-.3.7-.7.7H15v-6h-6v6H3.7c-.4 0-.7-.3-.7-.7V10l9-6.8z"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 4h2v16H4zm4 0h2v16H8zm4.6.3 2-.5 4.2 15.5-2 .5z"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zm6 8h2a8 8 0 0 1-7 7.9V22h-2v-3.1A8 8 0 0 1 4 11h2a6 6 0 0 0 12 0z"/></symbol>
  <!-- 展开页 K 歌专用：带网罩横纹 + U 支架 + 底座的麦克风，小尺寸下也不会被看成录音圆点 -->
  <symbol id="i-mic-sing" viewBox="0 0 24 24">
    <path fill-rule="evenodd" d="M12 1.5a3.4 3.4 0 0 1 3.4 3.4v6.2a3.4 3.4 0 0 1-6.8 0V4.9A3.4 3.4 0 0 1 12 1.5zM9 4.9h6v1H9zm0 2.5h6v1H9zm0 2.5h6v1H9z"/>
    <path d="M5 11v1a7 7 0 0 0 14 0v-1h1.5v1a8.5 8.5 0 0 1-17 0v-1z"/>
    <path d="M11.2 19h1.6v3h-1.6z"/>
    <path d="M8 21.8h8v1.6H8z"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14zm-1 2v6l4.5 2.6L17 13.9l-3.5-2V7z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M13.4 5.6 15 7.2 10.2 12l4.8 4.8-1.6 1.6L6.9 12z"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M10.6 5.6 9 7.2 13.8 12 9 16.8l1.6 1.6L17.1 12z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5C3 5.7 3.7 5 4.5 5h4.2l2 2.2H19.5c.8 0 1.5.7 1.5 1.5v8.8c0 .8-.7 1.5-1.5 1.5h-15C3.7 19 3 18.3 3 17.5v-11z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 6.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zm0 2a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.2 5.6 5.6 4.2 7.8 6.4 6.4 7.8zM16.2 17.6l1.4-1.4 2.2 2.2-1.4 1.4zM18.4 4.2l1.4 1.4-2.2 2.2-1.4-1.4zM5.6 19.8l-1.4-1.4 2.2-2.2 1.4 1.4z"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12.7 3a8.8 8.8 0 1 0 8.2 11.6 7 7 0 0 1-8.2-11.6z"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.6 13.9 9l6.5 1.9-6.5 1.9L12 19.4l-1.9-6.6L3.6 10.9 10.1 9z"/></symbol>
  <symbol id="i-mix" viewBox="0 0 24 24"><path d="M5 3h2v7H5V3zm0 12h2v6H5v-6zm6-12h2v5h-2V3zm0 10h2v8h-2v-8zm6-10h2v12h-2V3zm0 14h2v4h-2v-4zM6 9.9a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2zM12 7.9a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2zM18 14.9a2.6 2.6 0 1 1 0 5.2 2.6 2.6 0 0 1 0-5.2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></symbol>
  <symbol id="i-mini" viewBox="0 0 24 24"><path d="M4 5h16v2.2H4zm0 12h16v2.2H4zm6.2-8.2h3.6v6.4h-3.6z"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 2v12h12V6H6zM8 8h8v8H8V8z"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4L17.65 6.35z"/></symbol>
  <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2 12h4.2l2.5-8 4 16 2.6-8H22v2h-5l-3.7 11.4-4-15.7L10.2 12H2z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 5h2v2H4zm4 0h12v2H8zM4 11h2v2H4zm4 0h12v2H8zm-4 6h2v2H4zm4 0h12v2H8z"/></symbol>
</svg>

<div class="shell">
  <!-- 自绘标题栏：窗口壳层的一部分，不属于业务 UI。
       .pywebview-drag-region 是 pywebview 在 frameless 下的拖拽区标记，
       等价于 ZCode 的 app-region:drag；窗口按钮区刻意不加，避免吞掉点击。 -->
  <div class="wc-title">
    <div class="wc-brand"><img src="/logo.png" alt=""><span>ELYSIUM</span></div>
    <div class="wc-drag pywebview-drag-region"></div>
    <div class="wc-path">LOSSLESS PLAYER</div>
    <div class="wc-ctrls">
      <button class="wc-ctrl" data-act="min" title="最小化" aria-label="最小化">─</button>
      <button class="wc-ctrl" data-act="max" title="最大化 / 还原" aria-label="最大化或还原">□</button>
      <button class="wc-ctrl" data-act="close" title="关闭" aria-label="关闭">✕</button>
    </div>
  </div>

  <aside class="side">
    <div class="side-brand">
      <div class="brand-mark"><img src="/logo.png" alt=""></div>
      <div class="brand-txt">
        <b>ELYSIUM</b>
        <span>LOSSLESS PLAYER</span>
      </div>
    </div>

    <nav class="snav" id="snav">
      <button class="snav-i on" data-nav="home" aria-label="首页" title="首页"><svg><use href="#i-home"/></svg><span>首页</span></button>
      <button class="snav-i" data-nav="search" aria-label="搜索" title="搜索"><svg><use href="#i-search"/></svg><span>搜索</span></button>
      <button class="snav-i" data-nav="library" aria-label="收藏库" title="收藏库"><svg><use href="#i-lib"/></svg><span>收藏库</span><em id="libCount">0</em></button>
      <button class="snav-i" data-nav="local" aria-label="本地音乐" title="本地音乐"><svg><use href="#i-folder"/></svg><span>本地音乐</span><em id="localCount" hidden></em></button>
      <button class="snav-i" data-nav="works" aria-label="我的作品" title="我的作品"><svg><use href="#i-mic"/></svg><span>我的作品</span><em id="worksCount" hidden></em></button>
      <button class="snav-i" data-nav="settings" aria-label="设置" title="设置"><svg><use href="#i-gear"/></svg><span>设置</span></button>
    </nav>

    <div class="side-scroll">
      <div class="side-sec">
        <div class="side-label">我的歌单 <em id="plCount">0</em><button class="side-add" id="plImport" title="导入歌单" aria-label="导入歌单"><svg><use href="#i-list"/></svg></button><button class="side-add" id="plAdd" title="新建歌单" aria-label="新建歌单"><svg><use href="#i-plus"/></svg></button></div>
        <div id="sidePlaylists" class="side-list"></div>
      </div>
      <div class="side-sec">
        <div class="side-label">我的歌手 <em id="artCount">0</em></div>
        <div id="sideArtists" class="side-list"></div>
      </div>
      <div class="side-sec">
        <div class="side-label">我的专辑 <em id="albCount">0</em></div>
        <div id="sideAlbums" class="side-list"></div>
      </div>
    </div>

  </aside>

  <div class="stage">
    <header class="bar">
      <div class="bar-l">
        <button class="ic nav-btn" id="navBtn" title="菜单" aria-label="菜单"><svg><use href="#i-list"/></svg></button>
        <button class="ic" id="backBtn" title="返回" aria-label="返回"><svg><use href="#i-back"/></svg></button>
        <button class="ic" id="styleBtn" title="风格电台" aria-label="风格电台"><svg><use href="#i-folder"/></svg></button>
      </div>

      <form class="search" id="searchForm" autocomplete="off">
        <div class="search-in">
          <svg class="sic"><use href="#i-search"/></svg>
          <input id="kw" type="text" placeholder="搜索歌曲、歌手、专辑，或粘贴链接"/>
          <button type="button" class="sic-clear" id="kwClear" hidden><svg><use href="#i-close"/></svg></button>
        </div>
      </form>

      <div class="bar-r">
        <button class="ic" id="themeBtn" title="切换主题" aria-label="切换主题"><svg><use href="#i-moon"/></svg></button>
        <button class="ic" id="panelBtn" title="队列与下载">
          <svg><use href="#i-queue"/></svg><em class="dot-badge" id="dlBadge" hidden>0</em>
        </button>
        <button class="ic" id="settingsBtn" title="设置" aria-label="设置"><svg><use href="#i-gear"/></svg></button>
      </div>
    </header>

    <main class="view" id="view"></main>
  </div>

  <footer class="player">
    <div class="mini-drag pywebview-drag-region"></div>
    <div class="pl-l">
      <div class="pl-art" id="plArt"><svg><use href="#i-note"/></svg><span class="spin" id="buffering" hidden></span></div>
      <div class="pl-meta">
        <div class="pl-title" id="plTitle">未在播放</div>
        <div class="pl-sub" id="plSub">从搜索结果里选一首</div>
      </div>
      <button class="ic pl-fav" id="plFav" title="收藏" aria-label="收藏"><svg><use href="#i-heart-o"/></svg></button>
    </div>

    <div class="pl-m">
      <div class="pl-ctrl">
        <button class="ic" id="modeBtn" title="顺序播放" aria-label="顺序播放"><svg><use href="#i-repeat"/></svg></button>
        <button class="ic" id="prevBtn" title="上一首" aria-label="上一首"><svg><use href="#i-prev"/></svg></button>
        <button class="pl-play" id="playBtn" title="播放 / 暂停" aria-label="播放 / 暂停"><svg><use href="#i-play"/></svg></button>
        <button class="ic" id="nextBtn" title="下一首" aria-label="下一首"><svg><use href="#i-next"/></svg></button>
        <button class="ic" id="lyricBtn" title="歌词" aria-label="歌词"><svg><use href="#i-quote"/></svg></button>
        <button class="ic" id="miniBtn" title="迷你条" aria-label="迷你条"><svg><use href="#i-mini"/></svg></button>
      </div>
      <div class="pl-seek">
        <span class="mono" id="curTime">0:00</span>
        <div class="seek" id="seekBar" role="slider" aria-label="播放进度" tabindex="0"
          aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 / 0:00">
          <div class="seek-tr"></div>
          <div class="seek-buf" id="seekBuf"></div>
          <div class="seek-fill" id="seekFill"></div>
          <div class="seek-dot" id="seekDot"></div>
        </div>
        <span class="mono" id="allTime">0:00</span>
      </div>
    </div>

    <div class="pl-r">
      <button class="ic" data-act="karaoke" title="K 歌这一首" aria-label="K 歌这一首"><svg><use href="#i-mic-sing"/></svg></button>
      <button class="pl-spec mono" id="plSpec" data-act="pq" title="切换播放音质">—</button>
      <div class="vol">
        <button class="ic" id="volBtn" title="静音 / 取消静音" aria-label="静音 / 取消静音"><svg><use href="#i-vol"/></svg></button>
        <input type="range" id="vol" min="0" max="100" value="80"/>
      </div>
      <button class="ic" id="panelBtn2" title="队列" aria-label="队列"><svg><use href="#i-queue"/></svg></button>
    </div>
  </footer>
</div>

<!-- 抽屉遮罩：任一抽屉打开时压暗主区，点按关闭（行为在 app.js 的 MutationObserver） -->
<div class="drawer-mask" id="drawerMask" hidden></div>

<aside class="drawer right" id="panelDrawer" hidden>
  <div class="drawer-head">
    <div class="dtabs">
      <button class="dtab on" data-pt="queue">队列</button>
      <button class="dtab" data-pt="dl">下载 <em id="dlCount">0</em></button>
    </div>
    <button class="ic" data-close="panelDrawer"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-body">
    <div id="queuePane"></div>
    <div id="dlPane" hidden></div>
  </div>
</aside>

<!-- 正在播放 · SP 式全屏展开层（P10）：一份 DOM、桌面/手机两套排布。
     保留 id=npDrawer 与 hidden 语义，openNp / 抽屉互斥 / Escape 逻辑全部照旧。
     歌词容器 id 仍是 npLyricBody，逐行高亮 / 自动跟随 / 点行 seek 整套复用。 -->
<div class="np-layer" id="npDrawer" hidden>
  <div class="np-head">
    <!-- 返回键统一左上角 ←：右上角 ✕ 是独立窗口语义，不适合页内层级返回 -->
    <button class="np-ico np-back" data-close="npDrawer" title="返回" aria-label="返回"><svg><use href="#i-back"/></svg></button>
    <div class="np-id">
      <div class="np-art" id="npArt"></div>
      <div class="np-id-txt">
        <div class="np-title ell" id="npTitle"></div>
        <div class="np-sub ell" id="npSub"></div>
      </div>
    </div>
  </div>

  <div class="np-main" id="npBody"></div>

  <div class="np-dock">
    <div class="np-seek-row">
      <span class="mono" id="npCurTime">0:00</span>
      <div class="seek" id="npSeekBar" role="slider" aria-label="播放进度" tabindex="0"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0:00 / 0:00">
        <div class="seek-tr"></div><div class="seek-buf" id="npSeekBuf"></div>
        <div class="seek-fill" id="npSeekFill"></div><div class="seek-dot" id="npSeekDot"></div>
      </div>
      <span class="mono" id="npAllTime">0:00</span>
    </div>
    <div class="np-keys">
      <!-- 左组：收藏 / K 歌（麦克风）/ 播放模式；手机端与右组各 3 键，左右对称 -->
      <div class="np-kl">
        <button class="np-ico" id="npFav" data-act="np-fav" title="收藏" aria-label="收藏"><svg><use href="#i-heart-o"/></svg></button>
        <button class="np-ico" data-act="karaoke" title="K 歌这一首" aria-label="K 歌这一首"><svg><use href="#i-mic-sing"/></svg></button>
        <button class="np-ico" id="npMode" data-act="np-mode" title="播放模式" aria-label="播放模式"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <!-- 中间组只留三键：上一首 / 播放 / 下一首，播放键严格落在视口中轴 -->
      <div class="np-kc">
        <button class="np-ico" data-act="np-prev" title="上一首" aria-label="上一首"><svg><use href="#i-prev"/></svg></button>
        <button class="np-play" id="npPlay" data-act="np-play" title="播放 / 暂停" aria-label="播放 / 暂停"><svg><use href="#i-play"/></svg></button>
        <button class="np-ico" data-act="np-next" title="下一首" aria-label="下一首"><svg><use href="#i-next"/></svg></button>
      </div>
      <div class="np-kr">
        <button class="np-spec mono" id="npSpec" data-act="pq" title="切换播放音质">—</button>
        <button class="np-ico" id="npQueueBtn" data-act="nptab" data-tab="queue" title="队列" aria-label="队列"><svg><use href="#i-queue"/></svg></button>
        <button class="np-ico" id="npMute" data-act="np-mute" title="静音" aria-label="静音"><svg><use href="#i-vol"/></svg></button>
        <input type="range" id="npVol" min="0" max="100" value="80" title="音量"/>
      </div>
    </div>
  </div>
</div>

<aside class="drawer right wide" id="settingsDrawer" hidden>
  <div class="drawer-head">
    <div class="dtabs"><button class="dtab on">设置</button></div>
    <button class="ic" data-close="settingsDrawer"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-body" id="settingsBody"></div>
</aside>

<aside class="drawer right xwide" id="importDrawer" hidden>
  <div class="drawer-head">
    <div class="dtabs"><button class="dtab on">导入歌单</button></div>
    <button class="ic" data-close="importDrawer"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-body" id="importBody"></div>
</aside>

<!-- 多端同步预览：dry-run 的差异清单，勾完才落盘（与导入歌单同一套规矩） -->
<aside class="drawer right xwide" id="syncDrawer" hidden>
  <div class="drawer-head">
    <div class="dtabs"><button class="dtab on">从远端拉取</button></div>
    <button class="ic" data-close="syncDrawer"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-body" id="syncBody"></div>
</aside>

<div class="lyric-layer" id="lyricLayer" hidden>
  <div class="lyric-card">
    <div class="lyric-head">
      <div>
        <div class="kicker">LYRICS</div>
        <h3 id="lyricTitle">歌词</h3>
      </div>
      <button class="ic" data-close="lyricLayer"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="lyric-body" id="lyricBody"></div>
    <div class="lyric-foot lrc-tools">
      <button class="btn ghost" data-act="lrc-off" data-d="-0.5" title="歌词提前半秒（歌词比人声慢时用）">−0.5s</button>
      <span class="mono" data-off>0ms</span>
      <button class="btn ghost" data-act="lrc-off" data-d="0.5" title="歌词延后半秒（歌词比人声快时用）">+0.5s</button>
      <button class="btn ghost" data-act="lrc-off" data-d="0" data-reset hidden>复位</button>
      <span class="lrc-gap"></span>
      <button class="btn ghost" id="lyricSave">保存 .lrc</button>
    </div>
  </div>
</div>

<!-- K 歌全屏层（P8）：伴奏 + 麦克风混录。关闭走 data-act="k-close"（要收麦克风、
     关 AudioContext、还播放器位置），不能用通用 data-close。 -->
<div class="sing-layer" id="singLayer" hidden>
  <div class="k-bg" id="kBg"></div>
  <div class="k-head">
    <button class="ic k-x" data-act="k-close" title="退出演唱" aria-label="退出演唱"><svg><use href="#i-back"/></svg></button>
    <div class="k-meta">
      <div class="k-title ell" id="kTitle"></div>
      <div class="k-sub">
        <span class="k-artist ell" id="kArtist"></span>
        <span class="k-badge mono" id="kKeyBadge" hidden title="调性 / 音域由原唱旋律自动解析，供参考"></span>
      </div>
    </div>
  </div>
  <div class="k-prog"><div class="k-prog-fill" id="kProgFill"></div></div>
  <!-- 舞台：ready 说明 / 倒数 / 结算；演唱中清空退场，让歌词占满主区 -->
  <div class="k-main">
    <div class="k-stage" id="kStage"></div>
    <div class="k-lines" id="kLines"></div>
    <!-- 实时音准（P9）：音名/音分读数在上，音阶轨严格居中 —— 左右不再有任何占位把中轴顶偏 -->
    <div class="k-pitch" id="kPitchBar">
      <div class="kp-top">
        <div class="kp-note mono" id="kpNote">—</div>
        <div class="kp-cents mono" id="kpCents">等你开口</div>
      </div>
      <div class="kp-bar">
        <div class="kp-ticks" id="kpTicks"></div>
        <div class="kp-target" id="kpTarget" hidden></div>
        <div class="kp-needle" id="kpNeedle"></div>
      </div>
    </div>
  </div>
  <!-- 控制坞：调音台面板（按需展开）+ 传输行 + 模式行。
       交互对齐全民K歌：原唱/伴唱是切换、调音进面板（通道推子+混响预设+耳返开关）、变调用步进器 -->
  <div class="k-ctl" id="kCtl">
    <div class="kc-mixer" id="kMixer" hidden>
      <div class="km-grid">
        <div class="km-ch">
          <div class="km-head"><span class="km-name"><svg><use href="#i-disc"/></svg>伴奏</span><span class="km-val mono" id="kAccValTxt"></span></div>
          <input type="range" class="k-fader" id="kAccVol" min="0" max="150" value="90" title="伴奏音量"/>
        </div>
        <div class="km-ch k-mic-only">
          <div class="km-head"><span class="km-name"><svg><use href="#i-mic"/></svg>人声</span><span class="km-val mono" id="kMicValTxt"></span></div>
          <input type="range" class="k-fader" id="kMicVol" min="0" max="200" value="100" title="人声音量"/>
          <div class="k-meter km-meter" title="麦克风电平"><span id="kMicLvl"></span></div>
          <label class="km-echo" title="耳返：耳机里听自己的声音。外放时建议关闭防啸叫">
            <input type="checkbox" class="switch" id="kEcho" checked/>耳返
          </label>
        </div>
        <div class="km-ch k-mic-only">
          <div class="km-head"><span class="km-name"><svg><use href="#i-spark"/></svg>音色</span><span class="km-val mono" id="kToneValTxt"></span></div>
          <input type="range" class="k-fader" id="kTone" min="-6" max="6" step="1" value="0" title="人声音色：向右明亮（齿音清晰），向左温暖（醇厚）"/>
          <div class="km-ends" aria-hidden="true"><span>温暖</span><span>明亮</span></div>
        </div>
        <div class="km-ch km-wide k-mic-only">
          <div class="km-head"><span class="km-name">混响</span></div>
          <div class="km-chips" id="kReverbChips" role="group" aria-label="混响预设">
            <button type="button" data-v="dry">干声</button>
            <button type="button" data-v="room">小房间</button>
            <button type="button" data-v="studio">录音棚</button>
            <button type="button" data-v="stage">演唱会</button>
            <button type="button" data-v="bath">澡堂</button>
          </div>
          <select id="kReverb" hidden title="混响（耳返空间感）">
            <option value="dry">干声</option>
            <option value="room">小房间</option>
            <option value="studio" selected>录音棚</option>
            <option value="stage">演唱会</option>
            <option value="bath">澡堂</option>
          </select>
          <select id="kPitch" hidden title="升降调（变调不变速 ±6 半音）">
            <option value="-6">−6</option>
            <option value="-5">−5</option>
            <option value="-4">−4</option>
            <option value="-3">−3</option>
            <option value="-2">−2</option>
            <option value="-1">−1</option>
            <option value="0" selected>原调</option>
            <option value="1">+1</option>
            <option value="2">+2</option>
            <option value="3">+3</option>
            <option value="4">+4</option>
            <option value="5">+5</option>
            <option value="6">+6</option>
          </select>
        </div>
      </div>
      <input type="checkbox" id="kVocal" hidden/>
    </div>
    <div class="kc-trans">
      <span class="k-clock"><span class="k-rec mono" id="kRecTime">0:00</span><span class="k-clock-cap" id="kClockCap">演唱中</span></span>
      <button class="btn primary kc-go" id="kBegin" data-act="k-begin" hidden>开始演唱</button>
      <button class="btn primary kc-finish" id="kFinish" data-act="k-finish" hidden><svg><use href="#i-stop"/></svg>唱完了</button>
    </div>
    <div class="kc-row">
      <div class="k-seg" id="kSeg" role="group" aria-label="原唱 / 伴唱（消人声）" title="消原唱状态：自动判定或手动选择">
        <button type="button" id="kVocalOn">原唱</button>
        <button type="button" id="kVocalOff">伴唱</button>
      </div>
      <div class="k-step" role="group" aria-label="升降调（变调不变速）" title="升降调（变调不变速 ±6 半音，适合自己音域的调）；唱完这首才可换">
        <button type="button" class="k-pitch-btn" id="kPitchDown" aria-label="降 1 个半音">−</button>
        <span class="k-step-val" id="kPitchTxt">原调</span>
        <button type="button" class="k-pitch-btn" id="kPitchUp" aria-label="升 1 个半音">＋</button>
      </div>
      <button type="button" class="k-mixer-btn" id="kMixerBtn" aria-expanded="false" aria-controls="kMixer" title="调音台：伴奏 / 人声 / 音色 / 混响 / 耳返">
        <svg><use href="#i-mix"/></svg>调音
      </button>
    </div>
  </div>
</div>

<!-- 输入浮层：替代原生 prompt()（新建/重命名歌单、下载目录），样式随主题 -->
<div class="ask-layer" id="askLayer" hidden>
  <div class="ask-card">
    <div class="ask-title" id="askTitle"></div>
    <input id="askInput" type="text" autocomplete="off"/>
    <div class="ask-acts">
      <button class="btn sm" id="askCancel">取消</button>
      <button class="btn sm primary" id="askOk">确定</button>
    </div>
  </div>
</div>

<div class="qmenu" id="qmenu" hidden></div>
<div class="ctxmenu" id="ctxmenu" hidden></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<audio id="audio" preload="metadata"></audio>

<script src="/window-chrome.js"></script>
<script src="/app.js"></script>
</body>
</html>
